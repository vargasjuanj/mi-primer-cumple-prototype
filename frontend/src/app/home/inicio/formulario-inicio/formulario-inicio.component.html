
    <p  id="tituloForm" class="text-center"  [ngStyle.xs]="{'margin-top.em': 3, 'font-weight':'bold', 'font-size.em':1.4}"  [ngStyle.sm]="{'margin-top.em': 3,  'font-size.em':2}" [ngStyle.md]="{'font-size.em':2}">Iniciar sesión o registrarme</p>

<br>
    <mat-form-field appearance="fill"  [ngStyle.xs]="{'fontSize.em' : 1.3}">
        <mat-label>
            Nombre
        </mat-label>
        <input matInput type="text" placeholder="Ingresar mi nombre"  [(ngModel)]="invitado.nombre" required>
        
    </mat-form-field>

    <mat-form-field appearance="fill"  [ngStyle.xs]="{'fontSize.em' : 1.3}">
        <mat-label>
            Apellido
        </mat-label>
        <input matInput type="text" placeholder="Ingresar mi apellido"   [(ngModel)]="invitado.apellido" required>
        
    </mat-form-field>
    
    <mat-form-field appearance="fill"  [ngStyle.xs]="{'fontSize.em' : 1.3}">
        <mat-label>Opcional</mat-label>
        
        <input matInput [matDatepicker]="picker" placeholder="Fecha de Nacimiento" [(ngModel)]="invitado.fechaDeNacimiento">
        <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
        <mat-datepicker #picker></mat-datepicker>
      </mat-form-field>

    <button [disabled]="bloquearBoton()"  [ngStyle.xs]="{'fontSize.em' : 1.3}"   mat-raised-button color="primary" id="entrar" (click)="iniciarORegistrarUsuario()" >

            <mat-icon>login</mat-icon>   
        <span class="ml-2 mr-4">Entrar</span>

    </button>
