<div id="carouselExampleIndicators" class="carousel slide" data-ride="carousel" data-interval=10000>
    <ol class="carousel-indicators">
      
      <li *ngFor="let imagen of imagenes,let i = index" data-target="#carousel" class="{{ (i == 0) ? 'active' : '' }}" attr.data-slide-to="{{i}}"></li>
   
    </ol>

    <div class="carousel-inner">
        <div class="carousel-item active">
            <img class="d-block img-fluid w-100 -h-100" src="../../../../assets/kid/yasmin.png" alt="Second slide">
          </div>
        <div *ngFor="let imagen of imagenes; let i = index" class="carousel-item ">
          <img class="d-block img-fluid w-100 -h-100" [src]="'../../../../assets/kid/'+imagen+'.png'" alt="First slide">
        </div>
 
      </div>
    <a class="carousel-control-prev" href="#carouselExampleIndicators" role="button" data-slide="prev">
      <span class="carousel-control-prev-icon" aria-hidden="true"></span>
      <span class="sr-only">Previous</span>
    </a>
    <a class="carousel-control-next" href="#carouselExampleIndicators" role="button" data-slide="next">
      <span class="carousel-control-next-icon" aria-hidden="true"></span>
      <span class="sr-only">Next</span>
    </a>
  </div>
